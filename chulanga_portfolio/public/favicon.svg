<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="c-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b14bf4" />
      <stop offset="100%" stop-color="#4b42f4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#0a0a0a" />
  
  <!-- Outer Glow -->
  <path d="M 190 400 V 120 H 270 A 90 90 0 0 1 360 210 A 90 90 0 0 1 270 300 H 190" 
        fill="none" 
        stroke="url(#c-gradient)" 
        stroke-width="70" 
        stroke-linecap="round" 
        filter="url(#glow)"
        opacity="0.5"/>
        
  <!-- Main Letter P -->
  <path d="M 190 400 V 120 H 270 A 90 90 0 0 1 360 210 A 90 90 0 0 1 270 300 H 190" 
        fill="none" 
        stroke="url(#c-gradient)" 
        stroke-width="70" 
        stroke-linecap="round" />
</svg>